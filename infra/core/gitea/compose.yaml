# Factory records: Gitea + PostgreSQL + one Gitea Actions runner. Project name factory-gitea; lives in
# /srv/factory/gitea on the factory VM. Ports are bound to 127.0.0.1 only; tailnet access goes through
# `tailscale serve` on the VM. Secrets: /srv/factory/secrets (infra/core/gen-secrets.sh).
name: factory-gitea

secrets:
  gitea_db_password:
    file: /srv/factory/secrets/gitea_db_password
  gitea_runner_token:
    file: /srv/factory/secrets/gitea_runner_token

services:
  gitea-db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gitea
      POSTGRES_DB: gitea
      POSTGRES_PASSWORD_FILE: /run/secrets/gitea_db_password
    secrets: [gitea_db_password]
    volumes:
      - gitea-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 10s
      retries: 10

  gitea:
    image: gitea/gitea:28.1.0
    restart: unless-stopped
    depends_on:
      gitea-db:
        condition: service_healthy
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD__FILE: /run/secrets/gitea_db_password
      GITEA__server__DOMAIN: ${GITEA_DOMAIN:-127.0.0.1}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-http://127.0.0.1:3000/}
      GITEA__server__SSH_DOMAIN: ${GITEA_DOMAIN:-127.0.0.1}
      GITEA__server__SSH_PORT: "2222"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__openid__ENABLE_OPENID_SIGNIN: "false"
      GITEA__openid__ENABLE_OPENID_SIGNUP: "false"
      GITEA__actions__ENABLED: "true"
      GITEA__mailer__ENABLED: "false"
    secrets: [gitea_db_password]
    volumes:
      - gitea-data:/data
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:2222:22"

  runner:
    image: gitea/act_runner:0.6.1
    restart: unless-stopped
    depends_on: [gitea]
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN_FILE: /run/secrets/gitea_runner_token
      GITEA_RUNNER_NAME: factory-core-1
      CONFIG_FILE: /config/runner.yaml
    secrets: [gitea_runner_token]
    volumes:
      - runner-data:/data
      - ./runner.yaml:/config/runner.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  gitea-db:
  gitea-data:
  runner-data:
